name: Release Please

# 自动版本管理：每次合并进 main 就自动生成 Release PR（升版本 + 更新 CHANGELOG）。
# 合并该 PR 后，release-please 会自动打 tag；release.yml 再据此构建并上传双端包。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          # 用真实 PAT（BOT_TOKEN）而非 GITHUB_TOKEN：这样它 push 的 tag 才触发 release.yml
          token: ${{ secrets.BOT_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

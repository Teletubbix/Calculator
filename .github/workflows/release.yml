name: Release

# 打 tag（v*）时自动：Linux 构建打包 + Windows 交叉编译打包 + 上传 GitHub Release
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk4
            zip

      - name: 交叉编译并打包
        run: bash scripts/package_windows.sh "$(cygpath -u "$GITHUB_WORKSPACE")" "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev

      - name: 编译并打包
        run: bash scripts/package_linux.sh "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: dist/*.tar.gz

  release:
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 不用 softprops 重新建 Release（避免与 release-please 竞态）；
      # 改为等 release-please 建好后，把产物上传到该 tag 对应的 Release。
      - name: 上传产物到 Release（等待 release-please 建好）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 最多等 ~2 分钟 release-please 建好 Release
          for i in $(seq 1 40); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            sleep 3
          done
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 \
            | xargs -0 -I{} gh release upload "$TAG" "{}" --clobber
          echo "已上传到 Release：$(gh release view "$TAG" --json name --jq '.name')"
